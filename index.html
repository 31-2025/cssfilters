<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p style="font-size: 25px;">Grayscale funkcija</p>
    <div class="galerija">
        <figure>
            <img src="pic1.jfif" alt="Prva slika" style="filter: grayscale(0%);">
            <figcaption>0% - Original</figcaption>
        </figure>
        <figure>
            <img src="pic1.jfif" alt="Druga slika" style="filter: grayscale(50%);">
            <figcaption>50% - Delimicno siva</figcaption>
        </figure>
        <figure>
            <img src="pic1.jfif" alt="Treca slika" style="filter: grayscale(100%);">
            <figcaption>100% - Crno bela</figcaption>
        </figure>
    </div>
    
    <p style="font-size: 25px;">Blur funkcija</p>
    <div class="galerija">
        <figure>
            <img src="pic2.jfif" alt="Prva slika" style="filter: blur(0px);">
            <figcaption>0px - Original</figcaption>
        </figure>
        <figure>
            <img src="pic2.jfif" alt="Druga slika" style="filter: blur(3px);">
            <figcaption>3px - Blago</figcaption>
        </figure>
        <figure>
            <img src="pic2.jfif" alt="Treca slika" style="filter: blur(5px);">
            <figcaption>10px - Jako</figcaption>
        </figure>
    </div>

    <p style="font-size: 25px;">Brightness funkcija</p>
    <div class="galerija">
        <figure>
            <img src="pic3.jfif" alt="Prva slika" style="filter: brightness(50%);">
            <figcaption>brightness(50%) - Tamnija slika.</figcaption>
        </figure>
        <figure>
            <img src="pic3.jfif" alt="Druga slika" style="filter: brightness(100%);">
            <figcaption>brightness(100%) - Normalna svetlina.</figcaption>
        </figure>
        <figure>
            <img src="pic3.jfif" alt="Treca slika" style="filter: brightness(150%);">
            <figcaption>brightness(150%) - Svetlija slika.</figcaption>
        </figure>
    </div>

    <p style="font-size: 25px;">Contrast funkcija</p>
    <div class="galerija">
        <figure>
            <img src="pic4.jfif" alt="Prva slika" style="filter: contrast(50%);">
            <figcaption>contrast(50%) - Manji kontrast.</figcaption>
        </figure>
        <figure>
            <img src="pic4.jfif" alt="Druga slika" style="filter: contrast(100%)">
            <figcaption>contrast(100%) - Normalan kontrast.</figcaption>
        </figure>
        <figure>
            <img src="pic4.jfif" alt="Treca slika" style="filter: contrast(200%);">
            <figcaption>contrast(200%) - Veci kontrast.</figcaption>
        </figure>
    </div>

    <p style="font-size: 25px;">Sepia funkcija</p>
    <div class="galerija">
        <figure>
            <img src="pic5.jfif" alt="Prva slika" style="filter: sepia(0%);">
            <figcaption>sepia(0%) - Originalna slika.</figcaption>
        </figure>
        <figure>
            <img src="pic5.jfif" alt="Druga slika" style="filter: sepia(50%);">
            <figcaption>sepia(50%) - Blagi sepia efekat.</figcaption>
        </figure>
        <figure>
            <img src="pic5.jfif" alt="Treca slika" style="filter: sepia(100%);">
            <figcaption>sepia(100%) - Potpuni sepia efekat.</figcaption>
        </figure>
    </div>

    <p style="font-size: 25px;">Kombinovanje funkcija</p>
    <div class="galerija">
        <figure>
            <img src="pic6.jfif" alt="Prva slika" style="filter: sepia(60%) brightness(120%) contrast(130%);">
            <figcaption>sepia(60%) - brightness(120%) - contrast(130%)</figcaption>
        </figure>
    </div>

    <p style="font-size: 25px;">Promena filtera prelaskom misa (hover)</p>
    <div class="galerija">
        <figure>
            <img src="pic7.jfif" alt="Prva slika" class="slika7">
        </figure>
    </div>
    
    <p style="font-size: 25px;">Razlika izmedju filter i opacity</p>
    <div class="galerija">
        <figure>
            <img src="pic8.jfif" alt="Prva slika" style="filter: grayscale(100%);">
            <figcaption>Filter - promena izgleda</figcaption>
        </figure>
        <figure>
            <img src="pic8.jfif" alt="Prva slika" style="opacity: 0.5;">
            <figcaption>Opacity - smanjena neprozirnost</figcaption>
        </figure>
    </div>
</body>
</html>
